<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unwinder CORS API Debug</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#1e293b;
    border-radius:15px;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.url{
    background:#111827;
    color:#38bdf8;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    word-break:break-all;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

pre{
    margin-top:20px;
    background:#020617;
    color:#7dd3fc;
    padding:20px;
    border-radius:10px;
    overflow:auto;
    white-space:pre-wrap;
}

.status{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 Unwinder API Debug</h1>

<div class="url">
GET https://160.250.222.211:8585/unwinder/api_info
</div>

<button id="btn">Fetch API</button>
<button id="change_btn">Change API</button>
<button id="reset_btn">Reset</button>



<div class="status" id="status"></div>

<pre id="output">Waiting...</pre>

</div>

<script>

    const DEFAULT_API = "https://160.250.222.211:8585/unwinder/api_info";
    let API = DEFAULT_API;


    function changeApi(CHANGED_API) {
        API = CHANGED_API;
    }




    const reset_btn=document.getElementById("reset_btn");
    reset_btn.onclick = async ()=>{
          changeApi(DEFAULT_API);
    };


    const change_btn=document.getElementById("change_btn");
    change_btn.onclick = async ()=>{
          changeApi("https://160.250.222.211:8585/unwinder/10/paged");
    };

    const btn=document.getElementById("btn");
    const status=document.getElementById("status");
    const output=document.getElementById("output");

    btn.onclick = async ()=>{

        console.clear();

        console.log("Origin:", window.location.origin);
        console.log("Location:", window.location.href);

        status.innerHTML="Loading...";
        output.textContent="";

        try{

            const response = await fetch(API,{
                method:"GET",
                mode:"cors",
                cache:"no-cache"
            });

            console.log("Response:",response);
            console.log("Status:",response.status);

            const text = await response.text();

            console.log("Body:",text);

            status.innerHTML="✅ Success";

            output.textContent=text;

        }
        catch(error){

            console.error("FULL ERROR:",error);

            status.innerHTML="❌ Failed";

            output.textContent=
    `Message:
    ${error.message}

    Name:
    ${error.name}

    Origin:
    ${window.location.origin}

    Location:
    ${window.location.href}

    See the browser Console (F12) for more details.
    `;

        }

    };

</script>

</body>
</html>
