<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>African ISO Countries</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}
body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0ea5e9);
    min-height:100vh;
    padding:40px;
}
.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}
header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    text-align:center;
    padding:30px;
}
header h1{
    font-size:34px;
}
header p{
    margin-top:10px;
    opacity:.9;
}
.toolbar{
    text-align:center;
    padding:25px;
    background:#f8fafc;
}
button{
    border:none;
    padding:14px 26px;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}
button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37,99,235,.35);
}
#status{
    margin-top:15px;
    color:#16a34a;
    font-weight:bold;
}
table{
    width:100%;
    border-collapse:collapse;
}
thead{
    background:#1e40af;
    color:white;
}
th,td{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}
tbody tr:nth-child(even){
    background:#f8fafc;
}
tbody tr:hover{
    background:#dbeafe;
}
.serial{
    color:#2563eb;
    font-weight:bold;
}
.alpha{
    color:#7c3aed;
    font-size:20px;
    font-weight:bold;
}
.code{
    color:#dc2626;
    font-weight:bold;
}
footer{
    padding:20px;
    text-align:center;
    background:#f8fafc;
}
@media(max-width:700px){
table{
display:block;
overflow:auto;
}
}
</style>

</head>
<body>

<div class="container">

<header>
<h1>African ISO Countries</h1>
<p>Alphabetically Sorted ISO 3166-1 Country List</p>
</header>

<div class="toolbar">
<button onclick="copyNames()">📋 Copy JSON Names</button>
<div id="status"></div>
</div>

<table>

<thead>
<tr>
<th>Serial</th>
<th>Alphabet</th>
<th>Country Name</th>
<th>ISO</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<footer>
Total African Countries: <strong id="total"></strong>
</footer>

</div>

<script>

const countries = [
{name:"Algeria",code:"DZ"},
{name:"Angola",code:"AO"},
{name:"Benin",code:"BJ"},
{name:"Botswana",code:"BW"},
{name:"Burkina Faso",code:"BF"},
{name:"Burundi",code:"BI"},
{name:"Cabo Verde",code:"CV"},
{name:"Cameroon",code:"CM"},
{name:"Central African Republic",code:"CF"},
{name:"Chad",code:"TD"},
{name:"Comoros",code:"KM"},
{name:"Democratic Republic of the Congo",code:"CD"},
{name:"Djibouti",code:"DJ"},
{name:"Egypt",code:"EG"},
{name:"Equatorial Guinea",code:"GQ"},
{name:"Eritrea",code:"ER"},
{name:"Eswatini",code:"SZ"},
{name:"Ethiopia",code:"ET"},
{name:"Gabon",code:"GA"},
{name:"Gambia",code:"GM"},
{name:"Ghana",code:"GH"},
{name:"Guinea",code:"GN"},
{name:"Guinea-Bissau",code:"GW"},
{name:"Ivory Coast",code:"CI"},
{name:"Kenya",code:"KE"},
{name:"Lesotho",code:"LS"},
{name:"Liberia",code:"LR"},
{name:"Libya",code:"LY"},
{name:"Madagascar",code:"MG"},
{name:"Malawi",code:"MW"},
{name:"Mali",code:"ML"},
{name:"Mauritania",code:"MR"},
{name:"Mauritius",code:"MU"},
{name:"Morocco",code:"MA"},
{name:"Mozambique",code:"MZ"},
{name:"Namibia",code:"NA"},
{name:"Niger",code:"NE"},
{name:"Nigeria",code:"NG"},
{name:"Republic of the Congo",code:"CG"},
{name:"Rwanda",code:"RW"},
{name:"Sao Tome and Principe",code:"ST"},
{name:"Senegal",code:"SN"},
{name:"Seychelles",code:"SC"},
{name:"Sierra Leone",code:"SL"},
{name:"Somalia",code:"SO"},
{name:"South Africa",code:"ZA"},
{name:"South Sudan",code:"SS"},
{name:"Sudan",code:"SD"},
{name:"Tanzania",code:"TZ"},
{name:"Togo",code:"TG"},
{name:"Tunisia",code:"TN"},
{name:"Uganda",code:"UG"},
{name:"Zambia",code:"ZM"},
{name:"Zimbabwe",code:"ZW"}
];

const tbody=document.getElementById("tbody");

countries.forEach((country,index)=>{
tbody.innerHTML+=`
<tr>
<td class="serial">${index+1}</td>
<td class="alpha">${country.name[0]}</td>
<td>${country.name}</td>
<td class="code">${country.code}</td>
</tr>
`;
});

document.getElementById("total").innerText=countries.length;

function copyNames(){
const names=countries.map(c=>c.name);
navigator.clipboard.writeText(JSON.stringify(names,null,2));
document.getElementById("status").innerHTML="✅ JSON copied to clipboard.";
setTimeout(()=>{
document.getElementById("status").innerHTML="";
},2500);
}

</script>

</body>
</html>
