
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> PDF Reader</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #17191f;
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Header */
header {
    height: 55px;
    min-height: 55px;
    background: #22252d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #353944;
}

header h2 {
    font-size: 17px;
    font-weight: 500;
}

header a {
    color: #ffffff;
    text-decoration: none;
    background: #343945;
    padding: 8px 13px;
    border-radius: 5px;
    font-size: 13px;
}

header a:hover {
    background: #485064;
}

/* PDF container */
main {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #34363b;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* Footer */
footer {
    height: 30px;
    min-height: 30px;
    background: #22252d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #9299a8;
}
</style>
</head>

<body>

<header>
    <h2>PDF Reader</h2>

    <a href="quran_conflicts.pdf" target="_blank">
        Open PDF
    </a>
</header>

<main>
    <iframe
        src="quran_conflicts.pdf"
        title="PDF Document">
    </iframe>
</main>

<footer>
    quran_conflicts.pdf | PDF Document Viewer
</footer>

</body>
</html>
